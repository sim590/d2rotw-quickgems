# Profil mesuré sur une capture 2560x1440 de Diablo II: Resurrected
# (Reign of the Warlock), cache ouvert, onglet Gemmes.
#
# Toutes les coordonnées du panneau et de la table sont relatives au coin
# supérieur gauche du panneau "Cache" dans la fenêtre du jeu.
image_width = 2560
image_height = 1440

[panel]
x = 130
y = 120
width = 820
height = 900

[table]
# Bord droit de la zone du nombre pour chaque colonne (7 types de gemmes).
count_right_edges = [196, 277, 358, 440, 521, 603, 684]
# Haut du texte du nombre pour chaque rangée (5 paliers).
count_tops = [218, 284, 350, 417, 484]
# Fenêtre étroite de droite par type et par palier : elle protège des icônes
# blanches. Le lecteur essaie aussi une fenêtre large de 30 px pour chaque
# cellule et l'utilise si la fenêtre étroite ne garde qu'un « 0 » coupé d'un
# « 20 ». Ainsi toutes les cellules peuvent lire les nombres à deux chiffres.
count_windows = [
  [22, 22, 22, 22, 22], # Diamant
  [22, 22, 22, 22, 22], # Émeraude
  [22, 22, 22, 22, 22], # Rubis
  [22, 22, 22, 22, 22], # Topaze
  [22, 22, 22, 22, 22], # Améthyste
  [28, 28, 28, 28, 28], # Saphir
  [20, 20, 20, 20, 20], # Crâne
]
# Zone de lecture relative au bord droit et au haut du nombre.
roi_left = -34
roi_right = 4
roi_top = -1
roi_bottom = 18

# Onglets du cache, relatifs au panneau. Le contrôle d'onglet actif compare
# la luminosité de « Gemmes » à celle de « Partagé ».
[tabs]
gemmes = { x = 345, y = 112, width = 127, height = 40 }
partage = { x = 217, y = 112, width = 125, height = 40 }

# Coordonnées de clic, relatives au panneau.
[click]
# Centre d'une cellule source : bord droit du nombre - 30 px, haut - 16 px.
source_dx = -30
source_dy = -16
# Centre du bouton « Transmuter ».
transmute_x = 413
transmute_y = 870
# Point neutre dans la zone décorative gauche du panneau.
park_x = 250
park_y = 660

